[workspace]
resolver = "3"
members = [
    "crates/dsh",
    "crates/dsh-app",
    "crates/dsh-compaction",
    "crates/dsh-desktop",
    "crates/dsh-core",
    "crates/dsh-mcp",
    "crates/dsh-skill",
    "crates/dsh-wit",
    "crates/dsh-hooks",
    "crates/dsh-host",
    "crates/dsh-llm",
    "crates/dsh-sandbox",
    "crates/dsh-session",
    "crates/dsh-attachment",
    "crates/dsh-plan",
    "crates/dsh-agent-loop",
    "crates/dsh-prompt",
    "crates/dsh-tools",
    "crates/dsh-example-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# 棘轮:生产代码禁 unwrap/expect(测试经 clippy.toml 放行);
# 例外 = AGENTS.md §1 ①,逐点 #[allow] + 前提说明登记。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
jsonpath-rust = "1.0"
thiserror = "2"
toml = "1"
clap = { version = "4", features = ["derive"] }
wit-parser = "0.259"
tokio = { version = "1", features = ["full"] }
wasmtime = { version = "48", features = ["async"] }
wasmtime-wasi = "48"
turso = { version = "0.7.2", features = ["fts"] }
# /export ZIP 打包(stored 条目 + deflate)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
futures = "0.3"
libc = "0.2"
# gpui-pre FileDropEvent 载荷构造(与其共用 1.x)
smallvec = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# preset manifest 解析(serde_yaml 的接棒 fork)
serde_norway = "0.9"
wit-bindgen = "0.62"
dsh-app = { path = "crates/dsh-app" }
dsh-attachment = { path = "crates/dsh-attachment" }
dsh-core = { path = "crates/dsh-core" }
dsh-hooks = { path = "crates/dsh-hooks" }
dsh-host = { path = "crates/dsh-host" }
dsh-session = { path = "crates/dsh-session" }
dsh-compaction = { path = "crates/dsh-compaction" }
dsh-plan = { path = "crates/dsh-plan" }
dsh-wit = { path = "crates/dsh-wit" }
dsh-agent-loop = { path = "crates/dsh-agent-loop" }
dsh-prompt = { path = "crates/dsh-prompt" }
dsh-tools = { path = "crates/dsh-tools" }
dsh-llm = { path = "crates/dsh-llm" }
dsh-mcp = { path = "crates/dsh-mcp" }
dsh-skill = { path = "crates/dsh-skill" }
dsh-sandbox = { path = "crates/dsh-sandbox" }
portable-pty = "0.9.0"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
uuid = { version = "1", features = ["v4", "v7"] }
# GPUI 桌面门面:重导出 gpui(= gpui-pre)+ component/base/assets,升级走 semver
gpui-kit = "0.6.1"
pulldown-cmark = { version = "0.13", default-features = false }
# Mermaid → SVG(引擎选型见 kits/mermaid.rs);alpha 锁死防漂移
merman = { version = "=0.8.0-alpha.5", default-features = false, features = ["svg", "layout-cytoscape"] }
# Mermaid 查看器视口裁剪光栅(与 gpui 锁同版去重)
resvg = "0.48.1"
usvg = "0.48.1"
# macOS Dock 图标运行时绘制(objc2 系与 gpui 同源锁定)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = "0.3"
# 毛玻璃探针 winprobe(lock 内与 gpui 同一 0.6 实例)
raw-window-handle = "0.6"
# macOS 钥匙串凭据(非 macOS 平台该级缺席)
# 附件图片解码校验(与 gpui 锁同版)
image = "0.25"
sha2 = "0.11.0"
hex = "0.4"
# MCP client(stdio + streamable-http)
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# 附件 wire 编码(base64 / data URL)
base64 = "0.23"
# PDF 预览:pdf-syntax 解析 + 纯 Rust 栅格化(pdf-render 重导出;无 C 交付物)
pdf-render = "1.0"

[profile.dev]
# 全量 debuginfo 下 wasmtime+turso 构建达数十 GB;行号表足够日常调试
debug = "line-tables-only"

# 热点依赖 debug 下走优化;包名 = crates.io 真实名(gpui 发布为 gpui-pre)
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
ropey = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[profile.release]
lto = "thin"
strip = "symbols"
