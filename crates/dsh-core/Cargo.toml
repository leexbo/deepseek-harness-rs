[package]
name = "dsh-core"
description = "多会话应用核心:多会话注册表/线上协议类型/事件翻译/轨迹/统计/上下文(桌面客户端进程内消费)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
base64.workspace = true
anyhow.workspace = true
reqwest.workspace = true
dsh-agent-loop.workspace = true
dsh-app.workspace = true
dsh-host.workspace = true
dsh-llm.workspace = true
dsh-session.workspace = true
dsh-tools.workspace = true
dsh-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zip.workspace = true

# 钥匙串端口仅在 macOS 有实现(其他平台该凭据级缺席)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
